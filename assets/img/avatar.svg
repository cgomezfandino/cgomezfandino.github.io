<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="El sistema de Tato: un sol con la T (logo Eclipse-T) en el centro, órbitas con planetas y estrellas alrededor">
  <defs>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#DC2626" stop-opacity="0.30"/>
      <stop offset="55%" stop-color="#DC2626" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#DC2626" stop-opacity="0"/>
    </radialGradient>
    <mask id="sunT">
      <rect width="400" height="400" fill="#fff"/>
      <rect x="172" y="168" width="56" height="13" rx="6.5"/>
      <rect x="193.5" y="168" width="13" height="58" rx="6.5"/>
    </mask>
  </defs>

  <rect width="400" height="400" fill="#F3EBE1"/>

  <!-- estrellas -->
  <g fill="#1C1410" opacity="0.16">
    <circle cx="60" cy="70" r="1.6"/><circle cx="330" cy="58" r="1.3"/><circle cx="362" cy="205" r="1.5"/>
    <circle cx="46" cy="186" r="1.2"/><circle cx="82" cy="332" r="1.4"/><circle cx="342" cy="330" r="1.6"/>
    <circle cx="204" cy="38" r="1.2"/><circle cx="300" cy="362" r="1.2"/>
  </g>
  <circle cx="150" cy="92" r="1.7" fill="#DC2626" opacity="0.5"/>
  <circle cx="356" cy="150" r="1.4" fill="#DC2626" opacity="0.45"/>

  <!-- resplandor del sol -->
  <circle cx="200" cy="195" r="96" fill="url(#sunGlow)"/>

  <!-- órbitas inclinadas (plano de la eclíptica) -->
  <g transform="rotate(-18 200 195)" fill="none">
    <ellipse cx="200" cy="195" rx="150" ry="58" stroke="#1C1410" stroke-width="1.1" opacity="0.18"/>
    <ellipse cx="200" cy="195" rx="110" ry="42" stroke="#DC2626" stroke-width="1.1" opacity="0.32"/>
    <ellipse cx="200" cy="195" rx="80" ry="30" stroke="#DC2626" stroke-width="1.2" opacity="0.5"/>
  </g>

  <!-- planetas (situados sobre las órbitas) -->
  <circle cx="275" cy="182" r="6" fill="#DC2626"/>
  <circle cx="298" cy="124" r="5" fill="#DC2626"/>
  <circle cx="72" cy="257" r="4" fill="#1C1410" opacity="0.8"/>
  <g transform="rotate(-18 97 213)">
    <ellipse cx="97" cy="213" rx="17" ry="5.5" fill="none" stroke="#1C1410" stroke-width="1.5" opacity="0.5"/>
  </g>
  <circle cx="97" cy="213" r="9" fill="#1C1410"/>

  <!-- sol: marca Eclipse-T -->
  <circle cx="200" cy="195" r="52" fill="#1C1410" mask="url(#sunT)"/>
  <path d="M200 143 A 52 52 0 0 1 245 169" fill="none" stroke="#DC2626" stroke-width="8" stroke-linecap="round"/>

  <!-- nombre -->
  <text x="200" y="340" font-family="'Inter', system-ui, sans-serif" font-size="15" letter-spacing="6" text-anchor="middle" fill="#6B5D54">TATO</text>
</svg>
